name: Deploy site (GitHub Pages)

# Publica o site estático no GitHub Pages a cada push na branch de deploy.
on:
  push:
    branches:
      - claude/acesso-cloud-website-089pbc
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez, sem cancelar um em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          # Site estático servido a partir da raiz do repositório.
          path: .

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
